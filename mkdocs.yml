site_name: carve
site_description: carve work-item tracker
site_dir: ../docs_site
docs_dir: docs

theme:
  name: material
  palette:
    scheme: slate
    primary: indigo
    accent: cyan
  features:
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - search.suggest
    - content.tabs.link

plugins:
  - search
  - awesome-pages:
      sort_type: natural

hooks:
  - tools/mkdocs_hooks.py

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tabbed:
      alternate_style: true
  - toc:
      permalink: true
  - tables
  - meta
